<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudioCats</title>
<meta name="robots" content="noindex">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:system-ui,-apple-system,sans-serif;
    background:#FAF7F2;
    color:#1B2A4A;
    display:grid;
    place-content:center;
    text-align:center;
    padding:24px;
  }
  h1{
    font-size:clamp(28px,6vw,44px);
    font-weight:700;
    letter-spacing:-.02em;
  }
  .tag{
    margin-top:10px;
    font-size:11px;
    letter-spacing:.22em;
    color:#B8873F;
    text-transform:uppercase;
  }
  .line{
    width:44px;height:1px;
    background:#1B2A4A;
    opacity:.25;
    margin:28px auto;
  }
  p{font-size:13px;line-height:1.9;color:#5A6580}
  code{
    font-family:ui-monospace,monospace;
    font-size:12px;
    background:rgba(27,42,74,.07);
    padding:2px 6px;
    border-radius:2px;
  }
</style>
</head>
<body>
  <div>
    <h1>StudioCats</h1>
    <div class="tag">3D Art &amp; Design</div>
    <div class="line"></div>
    <p>
      포트폴리오 준비 중이야.<br>
      배포 확인용 임시 페이지 — <code>index.html</code>
    </p>
  </div>
</body>
</html>
