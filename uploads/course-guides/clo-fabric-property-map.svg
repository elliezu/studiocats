<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">CLO Fabric material and physical property map</title><desc id="desc">Diagram separating visible material controls from physical fabric controls.</desc>
  <rect width="1200" height="900" fill="#f8f8f6"/>
  <text x="72" y="106" fill="#102848" font-family="Arial, sans-serif" font-size="42" font-weight="700">FABRIC · 표현과 물성은 별도</text>
  <rect x="72" y="170" width="1056" height="104" rx="14" fill="#102848"/><text x="112" y="233" fill="#f8f8f6" font-family="Arial, sans-serif" font-size="31" font-weight="700">Object Browser → Fabric 탭 → 원단 선택 → Property Editor</text>
  <rect x="72" y="334" width="492" height="438" rx="16" fill="#e4f0ef" stroke="#2b6670" stroke-width="4"/><text x="114" y="400" fill="#102848" font-family="Arial, sans-serif" font-size="33" font-weight="700">Material</text><text x="114" y="444" fill="#526078" font-family="Arial, sans-serif" font-size="23">화면에서 보이는 표면</text><g fill="#2b6670" font-family="Arial, sans-serif" font-size="25"><text x="114" y="515">Front · Back · Side</text><text x="114" y="563">Material Type · Base Color</text><text x="114" y="611">Normal · Opacity</text><text x="114" y="659">Roughness · Reflection · Metalness</text></g>
  <rect x="636" y="334" width="492" height="438" rx="16" fill="#fff4df" stroke="#d88830" stroke-width="4"/><text x="678" y="400" fill="#102848" font-family="Arial, sans-serif" font-size="33" font-weight="700">Physical Property</text><text x="678" y="444" fill="#526078" font-family="Arial, sans-serif" font-size="23">시뮬레이션에서 움직이는 방식</text><g fill="#a86421" font-family="Arial, sans-serif" font-size="25"><text x="678" y="515">Preset</text><text x="678" y="563">Detail → Stretch Weft / Warp</text><text x="678" y="611">Detail → Shear</text><text x="678" y="659">한 항목씩 수정 후 GPU 시뮬레이션 비교</text></g>
</svg>
