  <g font-family="Arial, sans-serif" font-weight="700"><rect x="78" y="266" width="220" height="140" rx="14" fill="#f8f8f6"/><text x="110" y="325" fill="#102848" font-size="28">Object Browser</text><text x="110" y="365" fill="#526078" font-size="24">Scene</text><path d="M323 336h94" stroke="#efb36b" stroke-width="12"/><path d="m398 310 34 26-34 26" fill="none" stroke="#efb36b" stroke-width="12"/>
